<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Page</title>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 0;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }
    p {
      font-size: 20px;
      margin-bottom: 30px;
    }
    button {
      background-color: white;
      color: #764ba2;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #e0e7ff;
    }
  </style>
</head>
<body>

  <h1>Welcome to My Webpage 🌐</h1>
  <p>Click the button to see a greeting message!</p>
  <button onclick="showMessage()">Say Hello</button>

  <script>
    function showMessage() {
      alert("Hello, Prachi! 👋 Welcome to your first HTML page!");
    }
  </script>

</body>
</html>
