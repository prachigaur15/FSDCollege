<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favorite Fruits</title>

  <style>
    body {
      background-color: #fff7e6;
      font-family: "Poppins", sans-serif;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #ff6600;
    }

    ul {
      list-style-type: none;
      padding: 0;
    }

    li {
      background: #ffe0b2;
      margin: 10px auto;
      padding: 10px;
      width: 200px;
      border-radius: 10px;
      transition: 0.3s;
    }

    li:hover {
      background: #ffcc80;
      transform: scale(1.05);
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 10px;
    }

    a {
      display: inline-block;
      margin-top: 15px;
      color: #ff6600;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>🍎 My Favorite Fruits 🍌</h1>
  <p>Here are some of the fruits I like the most!</p>

  <ul>
    <li>
      <img src="https://via.placeholder.com/120x120?text=Apple" alt="Apple">
      <p>Apple</p>
    </li>
    <li>
      <img src="https://via.placeholder.com/120x120?text=Banana" alt="Banana">
      <p>Banana</p>
    </li>
    <li>
      <img src="https://via.placeholder.com/120x120?text=Grapes" alt="Grapes">
      <p>Grapes</p>
    </li>
  </ul>

  <a href="https://en.wikipedia.org/wiki/Fruit" target="_blank">
    Learn more about fruits 🍉
  </a>

</body>
</html>
