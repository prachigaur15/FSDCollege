<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>

  <style>
    body {
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .profile-card {
      background-color: white;
      border-radius: 15px;
      box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
      text-align: center;
      width: 300px;
      padding: 20px;
    }

    img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    h2 {
      color: #333;
      margin-bottom: 5px;
    }

    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }

    ul {
      list-style: none;
      padding: 0;
      text-align: left;
      color: #555;
      font-size: 14px;
    }

    button {
      background-color: #ff6b81;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
      transition: 0.3s;
    }

    button:hover {
      background-color: #ff4757;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <img src="https://via.placeholder.com/100" alt="Profile Photo">
    <h2>Prachi Gaur</h2>
    <p>Student | Web Developer | Learner</p>

    <h3>Hobbies:</h3>
    <ul>
      <li>🎨 Drawing</li>
      <li>💻 Coding</li>
      <li>📚 Reading</li>
    </ul>

    <button onclick="sayHello()">Say Hello 👋</button>
  </div>

  <script>
    function sayHello() {
      alert("Hello Prachi! Welcome to your profile page 😊");
    }
  </script>

</body>
</html>
